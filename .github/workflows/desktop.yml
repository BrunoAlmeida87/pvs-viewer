# Builds the Windows desktop app (Electron, portable .exe).
#  - every push to main that changes the viewer or the desktop app, and "Run workflow" in the
#    Actions tab: the .exe is attached to the run as an artifact (VisualizadorPVS-windows);
#  - pushing a tag v* (e.g. v1.2.0): also creates a Release with the .exe, version = tag.
# No model data is in the repository, so none goes into the executable.
name: Executável desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["viewer/**", "desktop/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]

# Read only by default: the build (which installs and runs third-party packages) cannot write to the
# repository. Only the release job, which runs no package code, gets write access.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Gerar o executável
        # signAndEditExecutable embeds the icon and version info (needs symlink rights, which the runner has)
        shell: bash
        run: |
          npm run copy
          npx electron-builder --win portable --publish never --config.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Anexar o executável à execução
        uses: actions/upload-artifact@v7
        with:
          name: VisualizadorPVS-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o executável gerado
        uses: actions/download-artifact@v8
        with:
          name: VisualizadorPVS-windows
          path: dist

      - name: Criar o Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # a Release made on the GitHub site (which also creates the tag) just gets the .exe attached
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe \
              --title "Visualizador PVS $GITHUB_REF_NAME" \
              --notes "Executável portátil para Windows (não precisa instalar). Abra e escolha a pasta do modelo (.pvs + .ol), ou arraste a pasta sobre o .exe."
          fi
