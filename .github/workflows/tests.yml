# Runs the automated tests on every push and pull request, on any branch, so that a change that
# breaks something is seen before it reaches main (the desktop workflow only builds the .exe).
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The tests use only Node's own modules and the viewer's files: no npm install needed.
      - name: Testes (node --test)
        run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências (numpy)
        run: python -m pip install numpy

      - name: Testes (tools/test_*.py)
        run: python -B -m unittest discover -s tools -p "test_*.py" -v
