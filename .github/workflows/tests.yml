# Runs the automated tests on every push and pull request, on any branch, so that a change that
# breaks something is seen before it reaches main (the desktop workflow only builds the .exe).
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests use only Node's own modules and the viewer's files: no npm install needed.
      - name: Testes (node --test)
        run: npm test
